    <tspan fill="#ff4444">YOUR-RAILWAYDOMAIN</tspan>
    <tspan>&amp;path=%2Fxray&amp;sni=</tspan>
    <tspan fill="#ff4444">YOUR-RAILWAYDOMAIN</tspan>
